name: release
# The only workflow that builds installers (G-07: no update feed; owners download by hand).
#   Run workflow (workflow_dispatch) → verify + Windows x64 + macOS, kept as artifacts for 14 days; nothing is published.
#   Run workflow with "publish" ticked (on main) → the same as a tag: the release vX.Y.Z (X.Y.Z = package.json version)
#                                       is created by this workflow, so the owner never types a git command.
#   Tag vX.Y.Z (the owner pushes it)  → the same, plus Windows arm64, then a GitHub Release with SHA-256 sums.
# Fixed download links (public repository): https://github.com/<owner>/<repo>/releases/latest/download/Bismuth-Setup.exe
# Jobs: verify (Linux, ci.yml: check + e2e) → windows (Linux + wine, NSIS) and macos (one job, both DMGs) and camera-addon
# (only when its box is ticked: Windows + Mac camera zips, kept in the private draft release "kamera") → publish.
# Fixed file names (scripts/release-names.mjs): Bismuth-Setup.exe, Bismuth-Setup-arm64.exe, Bismuth.dmg (Apple chip),
# Bismuth-Intel.dmg, SHA256SUMS.txt. The camera zips (Bismuth-Kamera-Windows.zip, Bismuth-Kamera-Mac.zip) are never public.
# Release notes: docs/surum-notlari/<tag>.md (Turkish, for the owner).
on:
  workflow_dispatch:
    inputs:
      camera_addon:
        description: 'Kamera ekini de üret (Bismuth-Kamera-Windows.zip, Bismuth-Kamera-Mac.zip): modeller ve hazır ek gizli "kamera" taslak sürümünde durur'
        type: boolean
        default: false
      publish:
        description: 'Sürümü yayınla: package.json sürümüyle (vX.Y.Z) GitHub Release oluşturur; yalnız main dalında'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - name: Publishing by hand only from main, and only a version not released yet
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF" != refs/heads/main ]; then echo "publish only from main (this is $GITHUB_REF)"; exit 1; fi
          # A draft left by a publish step that stopped half way does not count: the publish job replaces it.
          if [ "$(gh release view "v$VERSION" --repo "$REPO" --json isDraft --jq .isDraft 2> /dev/null)" = false ]; then
            echo "v$VERSION is already released: raise the version in package.json first"
            exit 1
          fi
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "tag $TAG does not match package.json version $VERSION (About would show the wrong version)"
            exit 1
          fi

  verify:
    needs: version
    uses: ./.github/workflows/ci.yml

  windows:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      WINEDEBUG: '-all'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # NSIS on Linux needs 64-bit and 32-bit wine (icon/version embedding and the uninstaller); about 2 minutes.
      - name: Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          # `wine` is the command electron-builder calls; wine64/wine32 alone do not provide it.
          sudo apt-get install -y --no-install-recommends wine wine64 wine32:i386
          wine --version
          # The first wine call creates its settings folder; done here, not inside electron-builder's 2-minute limit.
          timeout 120 wineboot -u || true
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Package (x64 always, arm64 only for a release)
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* || "$PUBLISH" == true ]]; then ARCH="--x64 --arm64"; else ARCH="--x64"; fi
          npx electron-builder --win nsis $ARCH --publish never
          node scripts/release-names.mjs release
          ls -la release
      - uses: actions/upload-artifact@v6
        with:
          name: installers-Windows
          path: |
            release/*.exe
          retention-days: 14
          compression-level: 0

  macos:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Package (Apple chip and Intel DMG in one job)
        run: |
          npx electron-builder --mac dmg --arm64 --x64 --publish never
          node scripts/release-names.mjs release
          ls -la release
      - name: Smoke test (packaged app)
        # The packaged app uses its own data folder (a fresh one on the runner). The mock keychain keeps a
        # Keychain question from ever waiting for a click nobody can give; the limit ends a stuck window early.
        timeout-minutes: 5
        run: |
          release/mac-arm64/Bismuth.app/Contents/MacOS/Bismuth --use-mock-keychain --smoke --smoke-out="$PWD/smoke.json" > smoke.log 2>&1 || true
          if [ ! -f smoke.json ]; then echo "no smoke result"; tail -60 smoke.log; exit 1; fi
          node -e "const r=require('./smoke.json'); console.log(JSON.stringify(r,null,1)); if(!r.ok||r.db.integrity!=='ok'||r.blockedRequests.length) process.exit(1)"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: smoke-log-macOS
          path: smoke.log
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: installers-macOS
          path: |
            release/*.dmg
          retention-days: 14
          compression-level: 0

  # Camera add-on (Faz 20 P20f): separate download, ~0.7 GB each (docs/otel/kurulum.md). Built on its own system because
  # insightface is compiled there (a Linux-built Windows add-on would not run): Windows x64 on windows-latest (x2), Apple
  # chip on macos-latest (x10). Runs only when its box is ticked (Actions minutes).
  # Privacy (owner, 2026-11-15): the model weights are not in the repository (yasak 14) and are never fetched from a public
  # address. The owner keeps them in the DRAFT release "kamera" of this repository (a draft is visible only to people who
  # can write to the repository), as kamera-modelleri.tar.gz; its sha256 is fixed below. The finished zips go back into
  # the same draft, never into an artifact (artifacts of a public repository can be downloaded by any GitHub user).
  camera-addon:
    needs: verify
    if: inputs.camera_addon
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            runs-on: windows-latest
          - target: mac-arm64
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    permissions:
      # Reading and writing the draft release "kamera".
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      # kamera-modelleri.tar.gz: yolo11n.pt + insightface/models/buffalo_s/{det_500m,w600k_mbf}.onnx (K-57).
      MODELS_SHA256: 277d2655defcdadceb7d3fa76c603bfb5b930f81412d20d81849121ab509f8ea
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Model files (from the private draft release "kamera")
        # Relative paths: GNU tar on Windows reads `C:\...` as a remote host.
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p models
          gh release download kamera --repo "$REPO" --pattern kamera-modelleri.tar.gz --output models.tar.gz \
            || { echo "kamera-modelleri.tar.gz not found in the draft release 'kamera' (docs/otel/kurulum.md, Kamera eki)"; exit 1; }
          echo "$MODELS_SHA256  models.tar.gz" | (sha256sum -c - 2>/dev/null || shasum -a 256 -c -)
          tar -xzf models.tar.gz -C models
      - name: Build the add-on
        run: node scripts/camera-bundle.mjs --target ${{ matrix.target }} --models "$RUNNER_TEMP/models" --out "$RUNNER_TEMP/addon"
      - name: Put the add-on into the private draft release "kamera"
        run: gh release upload kamera "$RUNNER_TEMP"/addon/Bismuth-Kamera-*.zip --repo "$REPO" --clobber

  publish:
    needs: [windows, macos, camera-addon]
    # camera-addon is skipped (not failed) unless CAMERA_ADDON=true or asked; a failed one blocks the release.
    if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && !failure() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            docs/surum-notlari
            package.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums (installers)
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum Bismuth* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          for f in Bismuth-Setup.exe Bismuth-Setup-arm64.exe Bismuth.dmg Bismuth-Intel.dmg; do
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
          done
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # A tag push names the release; a "publish" run takes it from package.json and creates the tag at this commit.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$REF_NAME"; else TAG="v$(node -p "require('./package.json').version")"; fi
          NOTES="docs/surum-notlari/$TAG.md"
          if [ ! -f "$NOTES" ]; then
            NOTES="$RUNNER_TEMP/notes.md"
            printf '%s\n' "Windows: Bismuth-Setup.exe (ARM işlemci: Bismuth-Setup-arm64.exe) · Mac (Apple çipli): Bismuth.dmg · Mac (Intel): Bismuth-Intel.dmg · Doğrulama: SHA256SUMS.txt · Kurulum: docs/otel/kurulum.md" > "$NOTES"
          fi
          # Draft first, public only when every file is up: a failed upload never leaves a half release behind, and
          # running the workflow again replaces the leftover draft.
          if [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2> /dev/null)" = true ]; then
            gh release delete "$TAG" --repo "$REPO" --yes
          fi
          gh release create "$TAG" dist/* --repo "$REPO" --target "$GITHUB_SHA" --draft \
            --title "Bismuth $TAG" \
            --notes-file "$NOTES"
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
