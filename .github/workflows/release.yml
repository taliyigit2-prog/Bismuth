name: release
# The only workflow that builds installers (G-07: no update feed; owners download by hand).
#   Run workflow (workflow_dispatch) → verify + Windows x64 + macOS, kept as artifacts for 14 days; nothing is published.
#   Tag vX.Y.Z (the owner pushes it)  → the same, plus Windows arm64, then a GitHub Release with SHA-256 sums.
# Jobs: verify (Linux, ci.yml: check + e2e) → windows (Linux + wine, NSIS) and macos (one job, both DMGs) and camera-addon
# (Windows + Mac, the camera zips; on a tag when the variable CAMERA_ADDON is `true`) → publish.
# Fixed file names (scripts/release-names.mjs): Bismuth-Setup.exe, Bismuth-Setup-arm64.exe, Bismuth.dmg (Apple chip),
# Bismuth-Intel.dmg, Bismuth-Kamera-Windows.zip, Bismuth-Kamera-Mac.zip, SHA256SUMS.txt (all of them).
# Release notes: docs/surum-notlari/<tag>.md (Turkish, for the owner).
on:
  workflow_dispatch:
    inputs:
      camera_addon:
        description: 'Also build the camera add-on (Bismuth-Kamera-Windows.zip, Bismuth-Kamera-Mac.zip; kept as artifacts); needs the model files in a secret'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "tag $TAG does not match package.json version $VERSION (About would show the wrong version)"
            exit 1
          fi

  verify:
    needs: version
    uses: ./.github/workflows/ci.yml

  windows:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      WINEDEBUG: '-all'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # NSIS on Linux needs 64-bit and 32-bit wine (icon/version embedding and the uninstaller); about 2 minutes.
      - name: Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine64 wine32:i386
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Package (x64 always, arm64 only for a tag)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then ARCH="--x64 --arm64"; else ARCH="--x64"; fi
          npx electron-builder --win nsis $ARCH --publish never
          node scripts/release-names.mjs release
          ls -la release
      - uses: actions/upload-artifact@v6
        with:
          name: installers-Windows
          path: |
            release/*.exe
          retention-days: 14
          compression-level: 0

  macos:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Package (Apple chip and Intel DMG in one job)
        run: |
          npx electron-builder --mac dmg --arm64 --x64 --publish never
          node scripts/release-names.mjs release
          ls -la release
      - name: Smoke test (packaged app)
        run: |
          export BISMUTH_USER_DATA="$RUNNER_TEMP/bismuth-smoke"
          release/mac-arm64/Bismuth.app/Contents/MacOS/Bismuth --smoke --smoke-out="$PWD/smoke.json" > smoke.log 2>&1 || true
          if [ ! -f smoke.json ]; then echo "no smoke result"; tail -60 smoke.log; exit 1; fi
          node -e "const r=require('./smoke.json'); console.log(JSON.stringify(r,null,1)); if(!r.ok||r.db.integrity!=='ok'||r.blockedRequests.length) process.exit(1)"
      - uses: actions/upload-artifact@v6
        with:
          name: installers-macOS
          path: |
            release/*.dmg
          retention-days: 14
          compression-level: 0

  # Camera add-on (Faz 20 P20f): separate download, ~0.7 GB each (docs/otel/kurulum.md). Built on its own system because
  # insightface is compiled there (a Linux-built Windows add-on would not run): Windows x64 on windows-latest (x2), Apple
  # chip on macos-latest (x10). The model weights are not in the repository (yasak 14): they come from the owner's private
  # release-assets storage via the secret CAMERA_MODELS_URL (a .tar.gz of resources/camera/models; sha256 in
  # CAMERA_MODELS_SHA256). Runs when asked (dispatch input: artifacts only) and on a version tag (the zips join the release
  # and SHA256SUMS.txt). On a tag it runs only when the repository variable CAMERA_ADDON is `true` (the owner sets it once the model secrets exist; Actions minutes).
  camera-addon:
    needs: verify
    if: inputs.camera_addon || (startsWith(github.ref, 'refs/tags/v') && vars.CAMERA_ADDON == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            runs-on: windows-latest
          - target: mac-arm64
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Model files (kept outside the repository)
        # The secrets reach only this step. Relative paths: GNU tar on Windows reads `C:\...` as a remote host.
        env:
          MODELS_URL: ${{ secrets.CAMERA_MODELS_URL }}
          MODELS_SHA256: ${{ secrets.CAMERA_MODELS_SHA256 }}
        run: |
          [ -n "$MODELS_URL" ] || { echo "secret CAMERA_MODELS_URL is empty"; exit 1; }
          [ -n "$MODELS_SHA256" ] || { echo "secret CAMERA_MODELS_SHA256 is empty"; exit 1; }
          cd "$RUNNER_TEMP"
          mkdir -p models
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o models.tar.gz "$MODELS_URL"
          echo "$MODELS_SHA256  models.tar.gz" | (sha256sum -c - 2>/dev/null || shasum -a 256 -c -)
          tar -xzf models.tar.gz -C models
      - name: Build the add-on
        run: node scripts/camera-bundle.mjs --target ${{ matrix.target }} --models "$RUNNER_TEMP/models" --out "$RUNNER_TEMP/addon"
      - uses: actions/upload-artifact@v6
        with:
          name: camera-addon-${{ matrix.target }}
          path: ${{ runner.temp }}/addon/Bismuth-Kamera-*.zip
          retention-days: 14
          compression-level: 0

  publish:
    needs: [windows, macos, camera-addon]
    # camera-addon is skipped (not failed) unless CAMERA_ADDON=true or asked; a failed one blocks the release.
    if: startsWith(github.ref, 'refs/tags/v') && !failure() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: docs/surum-notlari
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums (installers and, when it was built, the camera add-on zips)
        env:
          ADDON_RESULT: ${{ needs.camera-addon.result }}
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum Bismuth* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          for f in Bismuth-Setup.exe Bismuth-Setup-arm64.exe Bismuth.dmg Bismuth-Intel.dmg; do
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
          done
          if [ "$ADDON_RESULT" = success ]; then
            for f in Bismuth-Kamera-Windows.zip Bismuth-Kamera-Mac.zip; do
              [ -f "$f" ] || { echo "missing $f"; exit 1; }
            done
          fi
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          NOTES="docs/surum-notlari/$TAG.md"
          if [ ! -f "$NOTES" ]; then
            NOTES="$RUNNER_TEMP/notes.md"
            printf '%s\n' "Windows: Bismuth-Setup.exe (ARM işlemci: Bismuth-Setup-arm64.exe) · Mac (Apple çipli): Bismuth.dmg · Mac (Intel): Bismuth-Intel.dmg · Doğrulama: SHA256SUMS.txt · Kurulum: docs/otel/kurulum.md" > "$NOTES"
          fi
          gh release create "$TAG" dist/* --repo "$REPO" \
            --title "Bismuth $TAG" \
            --notes-file "$NOTES"
