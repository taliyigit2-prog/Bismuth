name: faz0-shell
# Faz 0 · A0.1 — package the spike shell for Windows (NSIS) and macOS (DMG, ad-hoc) with two Electron lines,
# smoke-run the unpacked app on each OS and report sizes. Artifacts are only uploaded for the line the owner tests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        electron: ["37.10.3", "44.5.1"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: prototypes/shell
    env:
      ELECTRON_LINE: ${{ matrix.electron }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (Electron ${{ matrix.electron }})
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund --save-exact --save-dev electron@${{ matrix.electron }}
          node -e "console.log('electron', require('electron/package.json').version)"
      - name: Package
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then npx electron-builder --win --publish never; else npx electron-builder --mac --publish never; fi
          ls -la release
      - name: Smoke test (unpacked app)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            APP="release/win-unpacked/Bismuth Proto.exe"
          else
            APP="release/mac-arm64/Bismuth Proto.app/Contents/MacOS/Bismuth Proto"
          fi
          OUT="$PWD/smoke-result.json"
          set +e
          "$APP" --smoke --smoke-out="$OUT" > smoke.log 2>&1
          echo "exit=$?"
          set -e
          if [ ! -f "$OUT" ]; then echo "no smoke result"; tail -60 smoke.log; exit 1; fi
          node -e "const r=require(process.argv[1]); console.log(JSON.stringify(r,null,1)); if(!r.allCss||!r.info.db.ok) process.exit(1)" "$OUT"
      - name: Sizes
        run: |
          {
            echo "### ${{ matrix.os }} · Electron ${{ matrix.electron }}"
            echo '```'
            ls -l release/*.exe release/*.dmg 2>/dev/null || true
            du -sh release/win-unpacked release/mac-arm64 2>/dev/null || true
            node -e "const r=require(process.argv[1]);console.log(JSON.stringify({electron:r.info.electron,chrome:r.info.chrome,node:r.info.node,platform:r.info.platform,os:r.info.osRelease,startupMs:r.info.startupMs,db:{ok:r.info.db.ok,sqlite:r.info.db.sqliteVersion,writeMs10k:r.info.db.writeMs10k,integrity:r.info.db.integrity},allCss:r.allCss},null,1))" "$PWD/smoke-result.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installer (Electron 37 line only)
        if: matrix.electron == '37.10.3'
        uses: actions/upload-artifact@v4
        with:
          name: bismuth-proto-${{ runner.os }}-electron${{ matrix.electron }}
          path: |
            prototypes/shell/release/*.exe
            prototypes/shell/release/*.dmg
          retention-days: 14
          compression-level: 0
