name: faz0-live-checks
# Faz 0 · A0.5 — live checks of FX / weather / holiday sources from a runner with open internet.
on:
  push:
    paths:
      - "prototypes/live-checks/**"
      - ".github/workflows/faz0-live-checks.yml"
  workflow_dispatch:
    inputs:
      samples:
        description: "FX samples"
        default: "4"
      interval:
        description: "Seconds between samples"
        default: "300"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run live checks
        working-directory: prototypes/live-checks
        run: node check.mjs --samples "${{ github.event.inputs.samples || '4' }}" --interval "${{ github.event.inputs.interval || '300' }}" --out results.json
      - uses: actions/upload-artifact@v4
        with:
          name: live-checks-${{ github.run_id }}
          path: prototypes/live-checks/results.json
          retention-days: 30
