name: ci
# Linux verification only: typecheck, lint, unit tests, hook tests, notices, build, e2e, packaged-app smoke test.
# Started by hand ("Run workflow") or called by release.yml, which owns all packaging. Pushes and pull requests do
# not start it, to save the account's limited Actions minutes (checks run in the development environment instead).
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    # The full e2e suite alone takes ~20 minutes on the runner; 30 left no room for a retry and cut the report off.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Claude hook tests
        run: node .claude/hooks/test-hooks.mjs
      - name: Third-party notices are up to date
        run: |
          npm run notices
          git diff --exit-code -- THIRD_PARTY_NOTICES.md src/renderer/features/about/third-party.json
      - run: npm run build
      - name: Playwright browser cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Playwright browser (phone view)
        run: npx playwright install --with-deps chromium
      - name: E2E — Electron app and phone view
        run: xvfb-run -a npx playwright test
      - name: Packaged app smoke test (Linux, fuses on)
        run: |
          npx electron-builder --linux dir --publish never
          # Only the built code may be inside the program (not the sources, tests or documents of the repository).
          EXTRA="$(npx asar list release/linux-unpacked/resources/app.asar | cut -d/ -f2 | sort -u | grep -vxE 'out|node_modules|package.json' || true)"
          if [ -n "$EXTRA" ]; then echo "unexpected content in app.asar:"; echo "$EXTRA"; exit 1; fi
          xvfb-run -a release/linux-unpacked/bismuth --no-sandbox --smoke --smoke-out="$PWD/smoke.json"
          node -e "const r=require('./smoke.json'); console.log(r); if(!r.ok||r.db.integrity!=='ok'||r.blockedRequests.length) process.exit(1)"
      - uses: actions/upload-artifact@v6
        # cancelled(): a run stopped by the time limit still uploads what it has.
        if: failure() || cancelled()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
